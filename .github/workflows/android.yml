name: ZR LingoTrip Android

on:
  push:
    branches: [main, "develop/**", "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore ZaydRazanChallenge/ZaydRazanChallenge.csproj

      - name: Build ZR LingoTrip APK
        run: dotnet publish ZaydRazanChallenge/ZaydRazanChallenge.csproj -c Release -f net9.0-android --no-restore -p:AndroidPackageFormats=apk

      - name: Upload ZR LingoTrip APK
        uses: actions/upload-artifact@v4
        with:
          name: ZR-LingoTrip-Android
          path: ZaydRazanChallenge/bin/Release/net9.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 30
