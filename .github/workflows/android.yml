name: ZR LingoTrip Android

on:
  push:
    branches: [main, "develop/**", "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore ZaydRazanChallenge/ZaydRazanChallenge.csproj

      - name: Prepare Android upload key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "Le secret ANDROID_KEYSTORE_BASE64 est absent."
          }
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\zrlingotrip-upload-key.jks",
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

      - name: Build signed APK and AAB
        shell: pwsh
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish ZaydRazanChallenge/ZaydRazanChallenge.csproj `
            -c Release `
            -f net9.0-android `
            --no-restore `
            -p:AndroidPackageFormats="'apk;aab'" `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:RUNNER_TEMP\zrlingotrip-upload-key.jks" `
            -p:AndroidSigningStorePass="$env:STORE_PASSWORD" `
            -p:AndroidSigningKeyAlias="$env:KEY_ALIAS" `
            -p:AndroidSigningKeyPass="$env:KEY_PASSWORD"

      - name: Upload signed Play Store files
        uses: actions/upload-artifact@v4
        with:
          name: ZR-LingoTrip-PlayStore
          path: |
            ZaydRazanChallenge/bin/Release/net9.0-android/publish/*-Signed.apk
            ZaydRazanChallenge/bin/Release/net9.0-android/publish/*-Signed.aab
          if-no-files-found: error
          retention-days: 30
