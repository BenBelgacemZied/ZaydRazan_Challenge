name: Android CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore ZaydRazanChallenge/ZaydRazanChallenge.csproj
      - name: Build Android
        run: dotnet build ZaydRazanChallenge/ZaydRazanChallenge.csproj -c Release --no-restore
